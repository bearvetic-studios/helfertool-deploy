services:
  helfertool:
    ports: !reset []
    volumes:
      - ./uwsgi.local-https.params:/etc/nginx/uwsgi_params:ro

  local-https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      helfertool:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - local-https-data:/data

volumes:
  local-https-data: