name: Build Helfertool Wrapper Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Dockerfile.smtp-graph
      - docker/**
      - relay/**
      - compose.yaml
      - compose.smtp-oauth.yaml
      - tests/test_generate_config.py
      - tests/test_graph_relay.py
      - tests/test_smtp_oauth_compose.py
      - scripts/healthcheck.sh
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      helfertool_version:
        description: Upstream helfertool/helfertool image tag
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test sender configuration and Graph relay
        run: |
          python -m pip install -r relay/requirements.txt
          python -m unittest discover -s tests -p 'test_[gs]*.py' -v

      - name: Set image version tag
        id: meta
        run: |
          VERSION="${{ inputs.helfertool_version || 'latest' }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == "latest" ]]; then
            echo "tags=ghcr.io/${{ github.repository_owner }}/helfertool:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${{ github.repository_owner }}/helfertool:${VERSION},ghcr.io/${{ github.repository_owner }}/helfertool:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HELFERTOOL_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Build and push Graph relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.smtp-graph
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/helfertool-smtp-graph:latest

