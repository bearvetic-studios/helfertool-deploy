name: Build Helfertool Wrapper Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/**
      - scripts/healthcheck.sh
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      helfertool_version:
        description: Upstream helfertool/helfertool image tag
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image version tag
        id: meta
        run: |
          VERSION="${{ inputs.helfertool_version || 'latest' }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == "latest" ]]; then
            echo "tags=ghcr.io/${{ github.repository_owner }}/helfertool:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${{ github.repository_owner }}/helfertool:${VERSION},ghcr.io/${{ github.repository_owner }}/helfertool:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HELFERTOOL_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}

