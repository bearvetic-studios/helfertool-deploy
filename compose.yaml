services:
  permissions:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /data /log /runtime /config && chmod 0750 /config && chmod 0600 /config/helfertool.yaml
    volumes:
      - ./config:/config
      - ./storage/data:/data
      - ./storage/log:/log
      - ./storage/run:/runtime

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?Set RABBITMQ_VHOST in .env}
    volumes:
      - ./storage/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  helfertool:
    image: ${HELFERTOOL_IMAGE:-helfertool/helfertool:latest}
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${HELFERTOOL_BIND_ADDRESS:-127.0.0.1}:${HELFERTOOL_PORT:-8080}:8000"
    volumes:
      - ./config:/config:ro
      - ./storage/data:/data
      - ./storage/log:/log
      - ./storage/run:/helfertool/run
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
